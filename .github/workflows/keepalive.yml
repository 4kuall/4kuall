# Wakes the Oracle once a day and touches its database, so a free Supabase
# project never pauses for inactivity and your library stays reachable.
name: Keep the Oracle awake
on:
  schedule:
    - cron: '17 3 * * *' # daily, 03:17 UTC
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the Oracle (wakes Render, then queries Supabase)
        run: |
          for i in 1 2 3; do
            out=$(curl -fsS --max-time 120 "${ORACLE_URL:-https://oracle-third-eye.onrender.com}/healthz?details") && echo "$out" && break
            sleep 30
          done
          echo "$out" | grep -q '"dbAlive":true' || { echo "Database did not respond"; exit 1; }
        env:
          ORACLE_URL: ${{ vars.ORACLE_URL }}
